[package]
name = "bookos-settings"
version = "0.6.0"
description = "BookOS Settings for KDE Plasma 6.6"
authors = ["BookOS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time", "net", "signal"] }
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }
libc = "0.2"
rqs_lib = { path = "rqs_lib" }
zbus = { version = "4", default-features = false, features = ["tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release profile — optimize for runtime speed.
# opt-level=3 maximizes execution speed (was "z" = size-min, the slowest at
# runtime); LTO + codegen-units=1 let the optimizer see the whole crate;
# strip removes debug symbols; panic=abort drops unwinding tables.
[profile.release]
opt-level = 3          # max runtime speed (trade: larger binary)
lto = true
codegen-units = 1
strip = true
panic = "abort"
