[General]
# ─────────────────────────────────────────────────────────────────────────────
# Valores POR DEFECTO del tema. No editar a mano para personalizar: BookOS
# Settings escribe theme.conf.user en esta misma carpeta y SDDM lo superpone
# encima de este fichero. Así una actualización del paquete bookos-branding
# reemplaza este theme.conf sin llevarse por delante los ajustes del usuario.
# ─────────────────────────────────────────────────────────────────────────────

# ── Aspecto ──────────────────────────────────────────────────────────────────
# variant: auto | light | dark
#   auto = sigue al escritorio, leyendo lo que deja
#   bookos-sddm-appearance-sync.service en /var/lib/sddm/bookos-appearance.conf
variant=auto
# Color de acento (anillo del avatar seleccionado, botones, foco).
# BookOS Settings puede recalcularlo desde el wallpaper y reescribirlo aquí.
accentColor=#007AFF
# Opacidad de las píldoras (sesión, apagado, BookBar), 0-100.
pillOpacity=80
# Oscurecimiento sobre el fondo, 0-100. Vacío = 50 en oscuro / 38 en claro.
# Es la palanca que salva la legibilidad con wallpapers claros o con mucho ruido.
overlayOpacity=

# ── Fondo ────────────────────────────────────────────────────────────────────
# background: solid | image | blur
background=blur
# Ruta relativa al tema (autocontenido en la ISO) o absoluta.
bgImage=backgrounds/bookos.png
# Intensidad con la que se PRECOMPUTA el desenfoque al empaquetar o al aplicar
# desde Settings (no se usa en runtime). Ver collect-branding.sh.
blurRadius=30

# ── Reloj y fecha ────────────────────────────────────────────────────────────
# Posición LIBRE: centro del bloque en % de la pantalla (0-100). El editor lo
# arrastra; las claves antiguas clockPosition/clockSize se siguen leyendo para
# convertir configuraciones previas, pero ya no se escriben.
clockX=50
clockY=14
# Tamaño en % sobre el base (40-260). 100 = 11,5% del alto de pantalla.
clockScale=100
# Grosor del trazo 100-900 (Fina → Negrita).
clockWeight=700
# Color del reloj: "auto" toma el tono del FONDO aclarado para que se lea
# siempre (lo calcula Settings en clockTint); o un #RRGGBB fijo.
clockColor=auto
clockTint=
# Opacidad del reloj, 20-100. A 100 es sólido; por debajo las cifras dejan ver
# el fondo a través y quedan como un cristal. La sombra de apoyo se mantiene,
# que es lo que las sigue separando del wallpaper cuando son muy translúcidas.
clockOpacity=100
# Estiramiento VERTICAL de las cifras, 100-260 (100 = sin estirar). Las cifras
# crecen a lo alto sin cambiar de ancho.
clockStretch=100
# Tipografía adaptable (el "Stretch Font" de One UI): con true el estiramiento
# lo decide clockAdaptV, que BookOS Settings recalcula al cambiar el fondo
# midiendo el hueco libre que deja el sujeto de la imagen.
clockAdapt=false
clockAdaptV=
# Tracking (espacio entre cifras) en % del cuerpo, de -8 a 8. Negativo aprieta.
clockTracking=-2

# ── Fecha ────────────────────────────────────────────────────────────────────
# Tamaño en % sobre el base (2,2 % del alto de pantalla).
dateScale=100
# Vacío = el mismo color del reloj; o un #RRGGBB propio.
dateColor=
# Grosor 100-900.
dateWeight=500
# Separación entre el reloj y la fecha, en píxeles del diseño (0-40).
dateGap=4

# clockFormat: 24h | 12h
clockFormat=24h
# clockFont: serif | sans | mono
clockFont=serif
showSeconds=false
showDate=true
# dateStyle: full ("lunes, 27 de julio") | short ("27/07/2026") | weekday ("lunes")
dateStyle=full
# Idioma de los nombres de día y mes. Sin esto Qt usa el locale del proceso
# greeter (inglés) y la fecha sale mezclada.
locale=es_ES

# ── BookBar ──────────────────────────────────────────────────────────────────
showBookBar=true
showBattery=true
# bookBarPosition: bottom | top
bookBarPosition=bottom
# bookBarSize: normal | compact
bookBarSize=normal

# ── Usuarios ─────────────────────────────────────────────────────────────────
# userSwitcher: row (todas las cuentas en fila) | single (solo la última)
userSwitcher=row

# ── Pantalla de bloqueo de Plasma (Win+L) ────────────────────────────────────
# El greeter de SDDM no las usa; las lee LockScreenUi.qml, que comparte este
# mismo fichero de configuración.
lockNotifications=true
# Contenido OCULTO por defecto: una pantalla bloqueada es justo cuando el equipo
# está desatendido, así que mostrar el texto lo filtraría a quien pase delante.
lockNotificationContent=false

# ── Widgets ──────────────────────────────────────────────────────────────────
# Lista separada por ';': battery, weather, date, notifications, calendar.
# Vacío = ninguno. Los dos últimos necesitan bus de sesión: en el greeter de
# SDDM no hay, así que allí esas tarjetas no se dibujan.
widgets=
# stack = colgando del reloj (se mueven con él) · free = grupo suelto en
# widgetsX/widgetsY (centro del grupo, en % de la pantalla).
widgetsLayout=stack
widgetsX=50
widgetsY=34
# Variante de cada widget: compact (píldora) | large (tarjeta completa).
# Formato: "weather:large;battery:compact"
widgetSize=
# Escala individual en % (50-200). Formato: "weather:120"
widgetScale=
# Posición individual cuando widgetsLayout=free. Formato: "weather:50,34"
widgetPos=
# Opacidad del FONDO de cada widget, 20-100. Formato: "battery:70;date:100".
# Solo el fondo: los textos siguen opacos, que si no el widget deja de leerse.
# El tiempo no entra — su color es el cielo del diseño, no una superficie.
widgetOpacity=

# ── Textos ───────────────────────────────────────────────────────────────────
# El greeter arranca antes de que haya sesión y no puede leer el idioma de
# BookOS Settings, así que el idioma viaja con el texto: al guardar el editor
# escribe aquí las cadenas ya traducidas al idioma de la app. Lo de abajo es el
# respaldo para una instalación que nunca haya pasado por el editor.
strBattery=Batería
strCharging=Cargando
# %1 = minutos que faltan para la carga completa.
strToFull=%1 min para carga completa
strNoEvents=Sin eventos
strNotifications=NOTIFICACIONES
strNotification=Notificación
strWrongPassword=Contraseña incorrecta
strCapsLock=Bloqueo de mayúsculas activado
strSession=Sesión
strExit=✕  Salir (Esc)
strStarted=Inicio
strFinish=Fin
strObjective=Objetivo
strDeactivateRoutine=Desactivar rutina
